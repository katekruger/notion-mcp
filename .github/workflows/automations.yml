name: Notion automations

on:
  schedule:
    - cron: "17 * * * *" # hourly; rules with a `schedule` fire on the first run at or after their time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; write nothing to Notion"
        type: boolean
        default: true
      rule:
        description: "Run only this rule id (blank for all enabled rules)"
        type: string
        default: ""
      force:
        description: "Run scheduled rules now, even if they aren't due"
        type: boolean
        default: false

permissions:
  contents: write # to save automation state on the notion-automations-state branch
  issues: write # to open an issue when a run fails

# Never let two runs overlap: a second run waits for the first instead of acting on the same rows.
concurrency:
  group: notion-automations
  cancel-in-progress: false

env:
  NOTION_PLUS_HOME: ${{ github.workspace }}/.notion-plus
  NOTION_PLUS_RULES: ${{ github.workspace }}/automations/rules.json
  NOTION_PLUS_WORKFLOWS: ${{ github.workspace }}/automations/workflows.json
  STATE_BRANCH: notion-automations-state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # The undo journal and run log carry over through the Actions cache. That's best effort: caches can be evicted,
      # which only shortens undo history.
      - name: Restore journal (best effort)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .notion-plus
          key: notion-plus-state-${{ github.run_id }}
          restore-keys: notion-plus-state-

      # Which scheduled occurrences fired, and unfinished work to resume, must not be lost, so it lives on its own
      # branch. Once that branch exists, a missing state file stops the run instead of re-firing old occurrences.
      - name: Restore automation state
        id: state
        run: |
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            mkdir -p .notion-plus
            git archive FETCH_HEAD | tar -x -C .notion-plus
            echo "require=true" >> "$GITHUB_OUTPUT"
            echo "Restored state from $STATE_BRANCH ($(git rev-parse --short FETCH_HEAD))."
          else
            echo "require=false" >> "$GITHUB_OUTPUT"
            echo "No $STATE_BRANCH branch yet: starting with fresh state (first run)."
          fi

      - name: Run rules
        id: run
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AUTOMATIONS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          AUTOMATIONS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          AUTOMATIONS_REQUIRE_STATE: ${{ steps.state.outputs.require }}
          RULE: ${{ inputs.rule }}
        run: npm run automations

      # Saved even when the run failed: unfinished rows and occurrences are recorded there, so the next run resumes them.
      - name: Save automation state
        if: always() && steps.state.outcome == 'success'
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            git worktree add --detach "$dir" FETCH_HEAD
          else
            git worktree add --detach "$dir"
            git -C "$dir" checkout --orphan state-init
            git -C "$dir" rm -rqf .
          fi
          if [ -d .notion-plus/workspaces ]; then
            (cd .notion-plus && find workspaces \( -name automation-state.json -o -name workflow-runs.json \) -exec cp --parents {} "$dir" \;)
          fi
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Automation state after run ${{ github.run_id }}"
          git push origin "HEAD:refs/heads/$STATE_BRANCH"

      - name: Save journal (best effort)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .notion-plus
          key: notion-plus-state-${{ github.run_id }}

      - name: Upload journal and run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notion-plus-journal-${{ github.run_id }}
          path: |
            .notion-plus/workspaces/*/journal.json
            .notion-plus/workspaces/*/automation-runs.jsonl
            .notion-plus/workspaces/*/automation-state.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Report failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const label = "notion-automations";
            const title = "Notion automations failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `A run failed at ${new Date().toISOString()}: ${run}\n\nThe job summary lists each rule's status. Unfinished rows and occurrences are retried on the next run; undo ids are in the run's journal artifact.`;
            try {
              // Make sure the label exists; creating an issue with a missing label fails.
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ ...context.repo, name: label, color: "d73a4a", description: "Failed Notion automation runs" });
              }
              const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: label });
              const existing = open.find((i) => i.title === title);
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
              }
            } catch (e) {
              // Reporting must not hide the original failure; say so in the job summary instead.
              core.warning(`Couldn't open or update the failure issue: ${e.message}`);
              await core.summary.addHeading("Notion automations failed").addRaw(`${body}\n\n(Opening an issue failed: ${e.message})`).write();
            }
