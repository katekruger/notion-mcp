name: Notion automations

on:
  schedule:
    - cron: "17 * * * *" # hourly; rules with a `schedule` fire on the first run at or after their time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; write nothing to Notion"
        type: boolean
        default: true
      rule:
        description: "Run only this rule id (blank for all enabled rules)"
        type: string
        default: ""
      force:
        description: "Run scheduled rules now, even if they aren't due"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # to open an issue when a run fails

# Never let two runs overlap: a second run waits for the first instead of acting on the same rows.
concurrency:
  group: notion-automations
  cancel-in-progress: false

env:
  NOTION_PLUS_HOME: ${{ github.workspace }}/.notion-plus

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Run state (which scheduled occurrences already fired), the undo journal, and the run log carry over between runs.
      - name: Restore automation state
        uses: actions/cache/restore@v4
        with:
          path: .notion-plus
          key: notion-plus-state-${{ github.run_id }}
          restore-keys: notion-plus-state-

      - name: Run rules
        id: run
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AUTOMATIONS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          AUTOMATIONS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          RULE: ${{ inputs.rule }}
        run: npm run automations

      - name: Save automation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .notion-plus
          key: notion-plus-state-${{ github.run_id }}

      - name: Upload journal and run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-plus-journal-${{ github.run_id }}
          path: |
            .notion-plus/workspaces/*/journal.json
            .notion-plus/workspaces/*/automation-runs.jsonl
            .notion-plus/workspaces/*/automation-state.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Notion automations failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `A run failed at ${new Date().toISOString()}: ${run}\n\nThe job summary lists each rule's result. Undo ids are in the run's journal artifact.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "notion-automations" });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["notion-automations"] });
            }
