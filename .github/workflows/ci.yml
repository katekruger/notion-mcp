name: CI

on:
  push:
    branches-ignore: [notion-automations-state] # automation state only, no code
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # the supported versions (SUPPORT.md)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Versions agree
        run: npm run check:version
      - name: No known advisories in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint, typecheck, tests with coverage thresholds, build
        run: npm run check

  docker:
    # Builds the webhook-mode image and checks that it starts, verifies signatures, and answers /healthz.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t notion-plus:ci .
      - name: Container starts and serves the webhook endpoint
        run: |
          docker run -d --name np -p 8787:8787 -e NOTION_TOKEN=secret_dummy -e NOTION_PLUS_WORKSPACE=ci \
            -e NOTION_PLUS_WEBHOOK_TOKEN=ci_token_123456 notion-plus:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/healthz | grep -q '"ok":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"id":"x"}' http://127.0.0.1:8787/notion/webhook)
          test "$code" = 401
      - if: always()
        run: docker logs np || true
