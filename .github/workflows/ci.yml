name: CI

on:
  push:
    branches-ignore: [notion-automations-state] # automation state only, no code
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # the supported versions (SUPPORT.md)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Versions agree
        run: npm run check:version
      - name: No known advisories in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint, typecheck, tests with coverage thresholds, build
        run: npm run check
