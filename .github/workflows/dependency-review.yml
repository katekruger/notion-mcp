name: Dependency review

# Flags pull requests that add dependencies with known vulnerabilities or incompatible licenses.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # GitHub only offers dependency review on public repos, or private repos with GitHub Code Security. Elsewhere the
    # job is skipped (CI's `npm audit --omit=dev` step still checks runtime dependencies). Set the repository
    # variable DEPENDENCY_REVIEW=true to run it on a private repo that has Code Security.
    if: ${{ !github.event.repository.private || vars.DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The review needs the Dependency graph (Settings → Advanced Security). When it's off, say so and skip
      # rather than fail every PR on a repository setting; CI's `npm audit` still guards runtime dependencies.
      - name: Check that the Dependency graph is on
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency graph is off, so dependency review was skipped. Turn it on at https://github.com/${{ github.repository }}/settings/security_analysis"
            {
              echo "## Dependency review skipped"
              echo "Turn on **Dependency graph** in Settings → Advanced Security (https://github.com/${{ github.repository }}/settings/security_analysis) to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        if: steps.graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
      - name: Explain a setup failure
        if: failure()
        run: |
          {
            echo "## Dependency review failed"
            echo "If the log says *Dependency review is not supported on this repository*, turn on **Dependency graph** in"
            echo "Settings → Advanced Security (https://github.com/${{ github.repository }}/settings/security_analysis), then re-run this job."
          } >> "$GITHUB_STEP_SUMMARY"
