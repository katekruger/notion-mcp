name: Live Notion tests

# The full smoke and acceptance suites against a throwaway Notion workspace: nightly, on release tags, and by hand.
# Needs repository secrets NOTION_TOKEN (an integration used only for testing) and NOTION_TEST_PAGE (a page shared
# with it). Without them, the run says so and passes. Never runs for pull requests, so forks can't reach the secrets.
on:
  schedule:
    - cron: "41 6 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-notion-tests
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_TEST_PAGE: ${{ secrets.NOTION_TEST_PAGE }}
    steps:
      - name: Check for test workspace secrets
        id: secrets
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_TEST_PAGE" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Live Notion tests skipped"
              echo "Add the repository secrets NOTION_TOKEN and NOTION_TEST_PAGE (a throwaway workspace; see README → Development) to run them."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Live tests skipped: NOTION_TOKEN / NOTION_TEST_PAGE secrets aren't set."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: Smoke suite (every tool, then cleanup)
        if: steps.secrets.outputs.ready == 'true'
        run: npm run smoke
      - name: Acceptance scenarios
        if: steps.secrets.outputs.ready == 'true'
        run: npm run acceptance
      - name: Upload acceptance report
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-report-${{ github.run_id }}
          path: acceptance-report.md
          if-no-files-found: ignore
