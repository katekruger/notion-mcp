name: Release bundles

# Push a tag like v0.7.0 to build an MCP Bundle for each platform and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # build provenance
  attestations: write

jobs:
  bundle:
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the others
      matrix:
        os: [macos-14, macos-15-intel, windows-latest, ubuntu-latest] # Apple silicon, Intel Mac, Windows, Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run check
      - run: npm run bundle
      # Install-test the bundle on this platform: unpack, start, list every tool, render a chart.
      - run: node scripts/bundle-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.os }}
          path: bundles/*.mcpb

  release:
    needs: bundle
    # Publish whatever bundles were built; a missing platform shows up as a failed bundle job. A manual run (a dry
    # run) goes through the checksums and SBOM too, and only a tag attests and publishes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: bundles
          merge-multiple: true
      - name: Checksums and SBOM
        run: |
          cd bundles && sha256sum *.mcpb > sha256sums.txt && cat sha256sums.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # npm sbom checks the whole installed tree, dev dependencies included, so install everything and leave the dev
      # ones out of the SBOM itself. Scripts stay off: nothing here needs to build.
      - run: cd src && npm ci --ignore-scripts && npm sbom --omit=dev --sbom-format cyclonedx > ../bundles/sbom.cdx.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: bundles/*.mcpb
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            bundles/*.mcpb
            bundles/sha256sums.txt
            bundles/sbom.cdx.json
          generate_release_notes: true
