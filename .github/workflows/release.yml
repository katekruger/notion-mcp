name: Release bundles

# Push a tag like v0.7.0 to build an MCP Bundle for each platform and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false # one platform failing shouldn't cancel the others
      matrix:
        os: [macos-14, macos-15-intel, windows-latest, ubuntu-latest] # Apple silicon, Intel Mac, Windows, Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: bundles/*.mcpb

  release:
    needs: bundle
    # Publish whatever bundles were built; a missing platform shows up as a failed bundle job.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/*.mcpb
          generate_release_notes: true
